# Nightly balance simulations (3,000 bot matches per bracket, every unit on a random talent build,
# every arena hosting the bracket in turn) and the 20-player performance profile (backlog X-06,
# M2-04). One runner cannot finish a bracket in its 4 hours, so each bracket is split into shards
# that run as parallel jobs (the plan job sizes them); the report job merges them, shows the balance and
# build tables in the run summary and warns about anything outside the targets.
name: nightly

on:
  # No schedule: a full run takes dozens of runner jobs; start it by hand when a balance question
  # needs one (the repository is public, so the minutes are free; DECISIONS.md 2026-10-02).
  workflow_dispatch:
    inputs:
      matches:
        description: Matches per bracket
        default: "3000"
      random_builds:
        description: Random legal talent builds per spec besides the named ones (M2-04)
        default: "21"

jobs:
  # Each bracket is split into shards that each finish well inside a runner's limit (about 40
  # minutes for 400 duels, 160 2v2 or 120 3v3 matches on 4 cores).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          MATCHES: ${{ inputs.matches || '3000' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, math, os
          n = int(os.environ["MATCHES"])
          inc = []
          for bracket, per in (("1v1", 400), ("2v2", 160), ("3v3", 120)):
              shards = max(1, math.ceil(n / per))
              inc += [{"bracket": bracket, "shards": shards, "shard": i} for i in range(shards)]
          print("matrix=" + json.dumps({"include": inc}))
          EOF

  balance:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/env/requirements.txt
      - uses: ./.github/actions/setup
      - name: Import the project
        run: godot --headless --path game --import > /dev/null 2>&1 || true
      - name: Simulate ${{ matrix.bracket }} shard ${{ matrix.shard }}
        run: |
          nproc
          python3 tools/sim/nightly.py --bracket ${{ matrix.bracket }} --matches ${{ inputs.matches || '3000' }} \
            --random-builds ${{ inputs.random_builds || '21' }} --shards ${{ matrix.shards }} --shard ${{ matrix.shard }} \
            --out nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-${{ matrix.bracket }}-${{ matrix.shard }}
          path: nightly/

  report:
    needs: balance
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bracket: ["1v1", "2v2", "3v3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: balance-${{ matrix.bracket }}-*
          path: shards
      - name: Report ${{ matrix.bracket }}
        run: python3 tools/sim/nightly.py --bracket ${{ matrix.bracket }} --merge shards --out nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-${{ matrix.bracket }}-report
          path: nightly/

  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/env/requirements.txt
      - uses: ./.github/actions/setup
      - name: Import the project
        run: godot --headless --path game --import > /dev/null 2>&1 || true
      - name: 20-player profile
        run: |
          nproc
          python3 tools/sim/nightly.py --perf --out nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-20bots
          path: nightly/
