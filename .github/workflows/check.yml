# Every automated check on every push and pull request (backlog X-06).
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_all:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # bpy 4.5 (Blender's Python) needs 3.11
          cache: pip
          cache-dependency-path: tools/env/requirements.txt

      - uses: ./.github/actions/setup

      - name: tools/check_all (full)
        run: tools/check_all

      - name: Keep logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            previews/matches/
            game/reports/
          if-no-files-found: ignore
